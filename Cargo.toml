[package]
name = "xen-space"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Intent-only multi-repo orchestration. Git owns facts; xen owns intent."
license = "Apache-2.0"
authors = ["Valerii Kremnev"]
repository = "https://github.com/sci2sci-opensource/xen"
homepage = "https://github.com/sci2sci-opensource/xen"
readme = "README.md"
keywords = ["git", "monorepo", "multirepo", "vcs", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "xen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "z"
