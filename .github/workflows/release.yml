name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  bin: xen, archive: tar.gz }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, bin: xen, archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,       bin: xen, archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      bin: xen, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bin: xen.exe, archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          stage="xen-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$stage/"
          cp README.md LICENSE "dist/$stage/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$stage.zip" "$stage" >/dev/null
          else
            tar czf "$stage.tar.gz" "$stage"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xen-${{ matrix.target }}
          path: dist/xen-*.${{ matrix.archive }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/xen-*
          generate_release_notes: true
